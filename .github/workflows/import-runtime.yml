name: Import USD Auto Converter runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and extract extension
        shell: bash
        run: |
          cat .runtime/part-* | base64 --decode > /tmp/auto-convert-runtime.zip
          mkdir -p /tmp/auto-convert-runtime
          unzip -q /tmp/auto-convert-runtime.zip -d /tmp/auto-convert-runtime
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/auto-convert-runtime/ ./
          rm -rf .runtime .import
          rm -f .github/workflows/import-runtime.yml
      - name: Commit imported extension
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import USD Auto Converter v1.1.0"
          git push
